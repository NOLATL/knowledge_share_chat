[project]
name = "playbook-api"
version = "0.1.0"
description = "Playbook FastAPI service: chat orchestration, extraction, RAG, reports."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "python-multipart>=0.0.12",
    "docling-slim>=2.0",
    "pypdfium2>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1",
    "playbook-shared",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
playbook-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
