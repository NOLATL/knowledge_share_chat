[project]
name = "playbook-shared"
version = "0.1.0"
description = "Shared models, question bank, and DB helpers for Playbook."
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.40",
    "llvmlite>=0.43",
    "networkx>=3.3",
    "numba>=0.60",
    "numpy>=2.0",
    "openai>=1.50",
    "pandas>=2.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playbook_shared"]
