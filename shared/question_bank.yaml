# ============================================================================
# Playbook discovery question bank — THE SINGLE SOURCE OF TRUTH for the script.
#
# This file is editable by non-engineers. Run `python scripts/reseed_questions.py`
# to sync it to the database; the conversation engine reads the ACTIVE questions
# from the DB at runtime, so a reseed takes effect on the next session with no
# redeploy.
#
# HOW TO EDIT
#   - Reword a question:      change its `text` (always safe).
#   - Reorder the script:     change `order_hint` (lower = asked earlier).
#   - Change importance:      set `tier` to must_fill | nice_to_have.
#   - Retire a question:      DELETE it here (reseed sets active=false; it is
#                             never hard-deleted, and its historical answers stay).
#   - Add a question:         add a new entry with a brand-new unique `slot_key`.
#
# THE ONE HARD RULE — slot_key is an immutable contract
#   NEVER rename or reuse an existing `slot_key`. Feature vectors and longitudinal
#   benchmarks are keyed on it; renaming silently breaks cross-cohort comparison.
#   To "change" a slot: retire the old key (remove it) and add a new key.
#
# FIELDS (all required)
#   slot_key      stable machine key, e.g. 'close.days' (immutable)
#   category      A | B | C | D | E | F  (see headers below)
#   text          the canonical intent; the agent improvises exact wording
#   framework_tag SPIN-* | MEDDIC-* | JTBD-*  (sales-methodology tag)
#   tier          must_fill | nice_to_have
#   order_hint    integer; lower is asked earlier
#   active        true | false (managed by reseed; leave true for live questions)
#
# Bump `version` whenever you change the script; every session records the
# version it was answered against (sessions.script_version).
# ============================================================================

