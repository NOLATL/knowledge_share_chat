[project]
name = "playbook-worker"
version = "0.1.0"
description = "Playbook analytics worker (cron + manual trigger)."
requires-python = ">=3.12"
dependencies = [
    "playbook-shared",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
playbook-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
